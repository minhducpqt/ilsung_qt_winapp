name: Build Windows App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Ensure PyInstaller is installed
        run: python -m pip install PyInstaller

      - name: Build Windows app
        run: python -m PyInstaller --noconfirm --clean ILSungQTWinApp.spec

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = "dist\ILSungQTWinApp.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            Write-Host "ERROR: $exe was not created."
            if (Test-Path "dist") {
              Get-ChildItem -Recurse dist
            }
            exit 1
          }
          Write-Host "Found $exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ILSungQTWinApp-Windows
          path: dist/ILSungQTWinApp.exe
          if-no-files-found: error
          retention-days: 1
